id: passive_whale_twap
name: Passive Whale / ETF TWAP
description: "Inflexible, price-insensitive slicing of large orders across a
  programmed session. ETF market-makers, corporate treasury, and OTC desks
  set a direction and a duration in advance and then execute regardless of
  the tape — the whale does not chase, does not panic, does not fade. The
  tribe's directional call is anchored to a long-window drift proxy (24h
  price change as a stand-in for persistent fund-flow direction) and stays
  fixed for the session. Steady per-tick pressure; tiny conviction per
  vote but persistent, so over a 6h window they contribute a meaningful
  steady bias that no reactive tribe can reproduce."
