id: ta_day_trader
name: TA Day Trader
description: >-
  Screen-trader with TradingView premium + Binance pro or Bybit. Mid-size capital,
  disciplined setups — waits for range breaks, retests, volume confirmation.
  Not glued to every tick; reacts when a clean setup prints.

demographics:
  # Sources: TradingView Premium paid-seat counts (crypto-tagged users),
  # Binance/Bybit "VIP 0–3" BTC-perps active-account bands from their
  # rebate-tier disclosures, and Coinglass Pro subscriber counts. Genuine
  # daily-active TA screen-traders on BTC perps ≈ 80k; prior 120k was
  # optimistic (it mixed in alt-focused screen-traders).
  capital_band_usd: [2000, 50000]
  count_estimate: 80000
  experience_years: [1, 8]
  jurisdiction: [global]

hardware:
  tier: workstation
  typical_latency_ms: 200
  uptime: continuous
  specs:
    screens: 2-4
    connectivity: fiber

software:
  platforms: [binance_pro, bybit, okx]
  tools: [tradingview_premium, tradingview_alerts, tradelocker]
  charting: advanced
  order_types_used: [limit, stop_limit, oco]
  data_feeds: [ohlcv, orderbook, funding, oi_snapshot]

strategy:
  family: breakout_trader
  params:
    range_window_seconds: 300        # 5-min range
    break_buffer_bps: 6
    hold_seconds: 240

attention:
  kinds: [trade, funding]
  tags: [price, taker_buy, taker_sell, mark_price]
  ignored_tags: [liq_long, liq_short]
  min_severity: 0.2

personality:
  risk_tolerance: 0.55
  fomo: 0.35
  panic: 0.3
  patience: 0.65
  herding: 0.35
  # Watches chart, confirms setup, then clicks — ~1min post-event.
  reaction_mu_seconds: 60.0
  reaction_sigma_seconds: 120.0

flow:
  # weight is OVERRIDDEN at load time (see derive.py). Value below = pre-derivation hand-tune.
  weight: 0.12
  # Semi-pro chart-watchers glued to 2–4 screens; most carry an order or
  # an alert-triggered setup every tick during their active hours. ~25%
  # of the cohort is expressing a directional view per tick (the rest are
  # between setups or managing an existing position silently).
  activation_rate: 0.25
  typical_hold_seconds: [300, 3600]
  default_conviction: 0.65
  cooldown_seconds: 60

disposition:
  # Disciplined: neutral until a setup prints. Whispers, not yells.
  idle_bias: 0.0
  idle_conviction: 0.05

circadian:
  # Global screen-traders concentrated in EU + US sessions. Peak around
  # EU afternoon + US open overlap (13–16 UTC).
  timezone_label: "EU+US"
  presence_by_hour_utc:
    [0.30, 0.25, 0.28, 0.35, 0.40, 0.50, 0.70, 0.85,
     0.95, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00,
     0.95, 0.85, 0.70, 0.55, 0.45, 0.40, 0.35, 0.30]

# Classic TA lens: RSI, momentum, taker volume, volatility regime.
# Discretionary — breakouts confirmed by RSI + volume. Stays out of chop.
indicators:
  rsi:
    window_s: 300
    overbought: 72
    oversold: 28
    action: follow         # break out of range → ride; extremes get taken for the break
    weight: 0.8
  price_momentum:
    window_s: 120
    ref_bps: 15
    action: follow
    weight: 0.7
  taker_imbalance:
    window_s: 120
    reference_usd: 800000
    action: follow         # volume confirms the break
    weight: 0.6
  volatility_regime:
    window_s: 600
    low_bps: 10
    high_bps: 60
    prefer: high           # they WANT volatility; low vol = stand aside
    weight: 0.4
indicator_weight: 0.5
# Setups need range breaks with volume — both pick up in expanding vol.
# In dead chop breakouts fail and traders stand aside → reduce indicator lean.
indicator_regime_range: 0.30
indicator_regime_low_bps: 12
indicator_regime_high_bps: 70
indicator_regime_prefer: high
indicator_regime_window_s: 600
