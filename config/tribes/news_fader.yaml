id: news_fader
name: News Fader
description: >-
  Fast-response pros who fade the initial overreaction to high-severity
  headlines. Live-wired: regulation/macro items get followed (regime
  signal), crypto-press/influencer items get faded (overreaction). RSS
  feed set lives in src/ingress/rss_feeds.py:CURATED_FEEDS (SEC, Fed,
  CFTC, Coindesk/Cointelegraph/etc, Substack, Nitter mirrors).

demographics:
  capital_band_usd: [50000, 1000000]
  count_estimate: 2000
  experience_years: [3, 15]
  jurisdiction: [NA, EU, APAC]

hardware:
  tier: workstation
  typical_latency_ms: 150
  uptime: continuous
  specs:
    screens: 2-4
    connectivity: fiber

software:
  platforms: [binance_pro, bybit, deribit]
  tools: [news_wire_api, tree_of_alpha_equivalent, custom_event_sniper]
  charting: advanced
  order_types_used: [market, ioc_limit]
  data_feeds: [cryptopanic, news_api, tree_of_alpha, exchange_announcements]

strategy:
  family: news_reactor
  params:
    hold_seconds: 300
    social_window_s: 900         # 15-min rolling sentiment
    min_social_volume: 3         # at least 3 scored posts in window
    extreme_social_score: 2.5    # |summed-score| above this → fade
    fgi_extreme: 0.5             # |fgi-50|/50 above this → fade (fallback)
  style_notes: >-
    Live-wired: fades the crowd when reddit pulse or FGI goes extreme.

attention:
  kinds: [news]
  tags: [headline, macro, regulatory, hack, exchange_announcement]
  ignored_tags: [orderbook_tick]
  min_severity: 0.6

personality:
  risk_tolerance: 0.65
  fomo: 0.2
  panic: 0.2
  patience: 0.5
  herding: 0.25
  # News-desk pros — headline-to-click in ~15s.
  reaction_mu_seconds: 15.0
  reaction_sigma_seconds: 30.0

flow:
  # weight is OVERRIDDEN at load time (see derive.py). Value below = pre-derivation hand-tune.
  weight: 0.05
  # News-driven pros silent on most ticks — trade only on headline bursts.
  # ~6% of the cohort is in an active fade position during any given tick
  # (most of the time there's no high-severity headline within the hold
  # window). Supports stronger punch during bursts than activation suggests.
  activation_rate: 0.06
  typical_hold_seconds: [120, 1200]
  default_conviction: 0.7
  cooldown_seconds: 60

disposition:
  # Waiting for a headline. Neutral at rest; strategy layer will bias from
  # FGI when social/news feeds have signal.
  idle_bias: 0.0
  idle_conviction: 0.05

circadian:
  # News-desk pros in NA/EU — peak during US/EU daytime when the bulk of
  # English-speaking financial news breaks.
  timezone_label: "EU+US (pro)"
  presence_by_hour_utc:
    [0.40, 0.35, 0.35, 0.40, 0.45, 0.55, 0.65, 0.80,
     0.90, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00,
     0.95, 0.85, 0.75, 0.65, 0.55, 0.50, 0.45, 0.40]

# News-fader lens — the tribe's whole identity. Three aliased news_pulse
# instances capture the critical split: regulation/macro is followed (a
# Fed cut is real), headline noise is faded (overreactions mean-revert),
# influencer chatter is faded (those posts are almost always too late).
indicators:
  news_pulse:regulation:
    window_s: 3600
    tag: regulation
    reference: 0.5
    action: follow
    weight: 1.0
  news_pulse:macro:
    window_s: 3600
    tag: macro
    reference: 0.5
    action: follow
    weight: 0.8
  news_pulse:news:
    window_s: 1800
    tag: news                    # coindesk/cointelegraph/decrypt — fade
    reference: 0.6
    action: fade
    weight: 0.8
  news_pulse:influencer:
    window_s: 1800
    tag: influencer
    reference: 0.6
    action: fade
    weight: 0.6
  fgi_bias:
    action: fade
    weight: 0.4
indicator_weight: 0.65           # news-tribe → indicators dominate the vote
