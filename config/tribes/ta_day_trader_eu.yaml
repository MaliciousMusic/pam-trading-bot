id: ta_day_trader_eu
name: TA Day Trader (EU desk)
description: >-
  Regional sub-archetype of the generic TA day trader, concentrated in
  EU trading hours (UTC 06-16). London/Frankfurt/Paris screen traders —
  fast reaction during EU-US overlap, standard range windows. Represents
  the regional-specialist subset that trades BTCUSDT during EU hours
  above and beyond the global ta_day_trader cohort.

demographics:
  capital_band_usd: [3000, 50000]
  count_estimate: 10000
  experience_years: [2, 10]
  jurisdiction: [EU, UK]

hardware:
  tier: workstation
  typical_latency_ms: 150
  uptime: continuous
  specs:
    screens: 2-4
    connectivity: fiber

software:
  platforms: [binance_pro, bybit, bitstamp, kraken]
  tools: [tradingview_premium, tradingview_alerts, bloomberg_terminal]
  charting: advanced
  order_types_used: [limit, stop_limit, oco, trailing_stop]
  data_feeds: [ohlcv, orderbook, funding, oi_snapshot]

strategy:
  family: breakout_trader
  params:
    range_window_seconds: 300
    break_buffer_bps: 6
    hold_seconds: 300

attention:
  kinds: [trade, funding]
  tags: [price, taker_buy, taker_sell, mark_price]
  ignored_tags: [liq_long, liq_short]
  min_severity: 0.2

personality:
  risk_tolerance: 0.55
  fomo: 0.30
  panic: 0.25
  patience: 0.70
  herding: 0.30
  # Fast reaction during active EU/US overlap.
  reaction_mu_seconds: 45.0
  reaction_sigma_seconds: 90.0

flow:
  weight: 0.03
  activation_rate: 0.25
  typical_hold_seconds: [300, 3600]
  default_conviction: 0.65
  cooldown_seconds: 45

disposition:
  idle_bias: 0.0
  idle_conviction: 0.05

circadian:
  # London 07-17 local = UTC 06-16 (summer DST). Peak during EU-US overlap
  # (13-16 UTC). Quiet on weekends/evenings.
  timezone_label: "EU (London/Frankfurt)"
  presence_by_hour_utc:
    [0.10, 0.10, 0.10, 0.15, 0.20, 0.40, 0.75, 0.95,
     1.00, 1.00, 1.00, 0.95, 0.95, 1.00, 1.00, 1.00,
     0.90, 0.60, 0.35, 0.25, 0.20, 0.15, 0.12, 0.10]

indicators:
  rsi:
    window_s: 300
    overbought: 72
    oversold: 28
    action: follow
    weight: 0.8
  price_momentum:
    window_s: 120
    ref_bps: 15
    action: follow
    weight: 0.7
  taker_imbalance:
    window_s: 120
    reference_usd: 800000
    action: follow
    weight: 0.6
  volatility_regime:
    window_s: 600
    low_bps: 10
    high_bps: 60
    prefer: high
    weight: 0.4
indicator_weight: 0.5
indicator_regime_range: 0.30
indicator_regime_low_bps: 12
indicator_regime_high_bps: 70
indicator_regime_prefer: high
indicator_regime_window_s: 600
