id: mev_frontrunner
name: MEV / Front-Runner
description: "Colocated extractors who front-run the micro-flow and liquidation
  cascades that the rest of the council only starts reacting to a step later.
  On the free tier, mempool-style signals are proxied from observable inputs:
  aggressive taker flow imbalance, imminent liquidation cluster (funding +
  OI + liq tape), and top-of-book 5bp imbalance. Competes with liquidation_hunter
  — but MEV takes the same directional call a full step earlier and is gone
  by the time the hunter's execution layer prints. Inflexible, short-hold,
  highly regime-dependent (thrives in cascades, mutes in chop)."
