id: retail_app_newbie
name: Retail App Newbie
description: >-
  Phone-only newcomer using eToro, Revolut, Coinbase-consumer, or Binance Lite.
  Checks the app a few times a day, reacts to "price going up" or "price going down"
  without charting. High FOMO, high panic, long latency. Tiny capital each — many of them.

demographics:
  capital_band_usd: [15, 500]
  count_estimate: 2000000
  experience_years: [0, 1]
  jurisdiction: [global]

hardware:
  tier: phone
  typical_latency_ms: 4000
  uptime: intermittent
  specs:
    screen: small
    connectivity: mobile_data

software:
  platforms: [etoro, revolut, coinbase_consumer, binance_lite, crypto_com_app]
  tools: []
  charting: none
  order_types_used: [market]
  data_feeds: [app_price_ticker]

strategy:
  family: app_fomo
  params:
    price_window_seconds: 600        # ~10min eye-on-price
    min_move_bps: 60                  # needs a visibly big move
    conviction_scale: 0.5
    hold_seconds: 7200
  style_notes: >-
    Chases recent moves. Buys into green runs after they've been running a while;
    panic-sells red. Rarely trades mid-range conditions.

attention:
  kinds: [trade, news, social]
  tags: [price, headline, influencer]
  ignored_tags: [funding, orderbook_tick, liquidation]
  min_severity: 0.4

personality:
  risk_tolerance: 0.3
  fomo: 0.9
  panic: 0.85
  patience: 0.1
  herding: 0.9

flow:
  weight: 0.05
  typical_hold_seconds: [3600, 86400]
  default_conviction: 0.4
  cooldown_seconds: 300

disposition:
  # HODLer instinct. When nothing is happening they're passively long —
  # "crypto always goes up eventually."
  idle_bias: 0.15
  idle_conviction: 0.10

circadian:
  # Smeared across all timezones — a bit dampened in global dead-hours
  # (02-06 UTC: NA asleep, EU asleep, APAC lunch), peaks during EU/US
  # overlap when the most phones are out.
  timezone_label: "global"
  presence_by_hour_utc:
    [0.35, 0.30, 0.28, 0.30, 0.35, 0.45, 0.55, 0.65,
     0.75, 0.85, 0.90, 0.95, 1.00, 1.00, 1.00, 0.95,
     0.90, 0.85, 0.80, 0.75, 0.70, 0.60, 0.50, 0.40]
