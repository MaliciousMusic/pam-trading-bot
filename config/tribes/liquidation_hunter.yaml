id: liquidation_hunter
name: Liquidation Hunter
description: >-
  Pros watching open-interest buildup + funding skews + the liquidation tape,
  positioning FOR cascade continuation. When big longs start getting flushed
  they stay short into the flush, not against it.

demographics:
  # Sources: Coinglass Pro / Hyblock paid subscriptions (+custom scanner
  # tooling adoption from GitHub stars on public liquidation-bot repos).
  # Cohort is narrow and pro-leaning — ~4k genuine specialists across the
  # big three venues; prior 5k was slightly generous.
  capital_band_usd: [50000, 2000000]
  count_estimate: 4000
  experience_years: [2, 15]
  jurisdiction: [NA, EU, APAC]

hardware:
  tier: workstation
  typical_latency_ms: 80
  uptime: continuous
  specs:
    screens: 3-6
    connectivity: fiber

software:
  platforms: [binance_pro, bybit, okx, deribit]
  tools: [coinglass_pro, tensorcharts, hyblock, custom_liq_scanner]
  charting: advanced
  order_types_used: [limit, stop_market, trailing_stop]
  data_feeds: [liquidation_feed, oi_time_series, funding, orderbook_imbalance]

strategy:
  family: liquidation_hunter
  params:
    liq_window_seconds: 60
    min_liq_usd: 750000
    hold_seconds: 180

attention:
  kinds: [liquidation, funding, trade]
  tags: [liq_long, liq_short, funding]
  ignored_tags: [news, social]
  min_severity: 0.3

personality:
  risk_tolerance: 0.65
  fomo: 0.2
  panic: 0.15
  patience: 0.55
  herding: 0.3
  # Pro workstation scanning liq tape continuously — sub-5s reaction.
  reaction_mu_seconds: 2.0
  reaction_sigma_seconds: 5.0

flow:
  # weight is OVERRIDDEN at load time (see derive.py). Value below = pre-derivation hand-tune.
  weight: 0.08
  # Specialist bots scan OI + liq tape continuously. They only act when a
  # cascade threshold fires, but the scan cadence is sub-second, so within
  # any 15s tick ~12% have an active position-scaling order. Coinglass pro
  # data + academic work on liq-cascade bots supports this range.
  activation_rate: 0.12
  typical_hold_seconds: [120, 1800]
  default_conviction: 0.75
  cooldown_seconds: 60

disposition:
  # Slight bearish resting bias — they're always scanning for the long-side
  # flush first (it happens more often in BTC perps).
  idle_bias: -0.05
  idle_conviction: 0.06

circadian:
  # Pros watching cascades — peak activity during US/EU overlap where the
  # deepest books and biggest liquidation prints happen. Still around off-hours
  # via alerts + automated stops, just muted.
  timezone_label: "EU+US (pro)"
  presence_by_hour_utc:
    [0.50, 0.45, 0.45, 0.50, 0.55, 0.65, 0.75, 0.85,
     0.95, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00,
     0.95, 0.85, 0.75, 0.65, 0.60, 0.55, 0.55, 0.50]

# Liq hunter lens: liq tape is primary. Funding extremes flag crowded
# positioning (ready to be flushed). High-vol regime is preferred — they
# don't care about quiet markets.
indicators:
  liq_imbalance:
    window_s: 60
    reference_usd: 500000
    action: follow            # ride the cascade direction (short into long-flushes)
    weight: 1.0
  funding_extreme:
    extreme: 0.0005
    action: fade              # positive funding → long-side crowded → short the flush
    weight: 0.7
  volatility_regime:
    window_s: 300
    low_bps: 20
    high_bps: 120
    prefer: high              # cascades happen in vol, not calm
    use_realized: true        # log-return stddev tracks cascade intensity better than range highs
    weight: 0.5
indicator_weight: 0.5
# Cascades only exist in high realized vol. Crank up indicator lean when
# the tape is moving; dial it back in dead chop (there's nothing to hunt).
indicator_regime_range: 0.40
indicator_regime_low_bps: 20
indicator_regime_high_bps: 120
indicator_regime_prefer: high
indicator_regime_window_s: 300
