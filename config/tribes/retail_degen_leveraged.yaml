id: retail_degen_leveraged
name: Retail Degen (Leveraged Perps)
description: >-
  Active retail running 10x–50x perps on Binance/Bybit/BitMEX. Piles onto whatever
  is ripping, doubles down into moves, gets liquidated often. Short attention,
  short holds, responds to print flow and especially to liquidation cascades.

demographics:
  capital_band_usd: [100, 5000]
  count_estimate: 400000
  experience_years: [0.5, 4]
  jurisdiction: [APAC, CIS, LATAM, EU]

hardware:
  tier: laptop
  typical_latency_ms: 500
  uptime: intermittent
  specs:
    screens: 1-2
    connectivity: home_broadband

software:
  platforms: [binance_pro, bybit, bitmex, blofin]
  tools: [tradingview_free, telegram_signal_groups]
  charting: basic
  order_types_used: [market, limit, stop_market]
  data_feeds: [price_ticker, liquidation_feed, telegram_groups]

strategy:
  family: momentum_chaser
  params:
    flow_window_seconds: 60
    min_net_flow_usd: 250000
    liq_amplifier: 1.8
    hold_seconds: 120
  style_notes: >-
    Chases short-window taker flow. Liquidation prints amplify signal strongly —
    a long-liq cascade pulls them strongly into shorts ("the flush").

attention:
  kinds: [trade, liquidation]
  tags: [taker_buy, taker_sell, liq_long, liq_short]
  ignored_tags: [funding]
  min_severity: 0.2

personality:
  risk_tolerance: 0.95
  fomo: 0.8
  panic: 0.6
  patience: 0.15
  herding: 0.8

flow:
  # weight is OVERRIDDEN at load time (see derive.py). Value below = pre-derivation hand-tune.
  weight: 0.18
  # Binance perps has ~30M accessible retail users; <3% run >20x leverage
  # (Binance public risk disclosures + Kaiko retail-flow reports). Of the
  # ~400k active degens, roughly 15% have an order in flight during any
  # given 15s tick during active hours.
  activation_rate: 0.15
  typical_hold_seconds: [60, 600]
  default_conviction: 0.7
  cooldown_seconds: 30

disposition:
  # Permabull degen lean — always slightly long, always itching to size up.
  idle_bias: 0.10
  idle_conviction: 0.08

circadian:
  # APAC-heavy: China, Korea, SEA, CIS. Peak UTC 02–10 (that's 10:00–18:00
  # in Beijing / 11:00–19:00 in Tokyo). Dead during US nighttime.
  timezone_label: "APAC"
  presence_by_hour_utc:
    [0.75, 0.90, 1.00, 1.00, 1.00, 1.00, 0.95, 0.90,
     0.85, 0.80, 0.70, 0.60, 0.50, 0.45, 0.40, 0.40,
     0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75]

# Degen lens: short-window flow, liq cascades, and recent momentum.
# They don't fade anything — they hit bid on every green candle. RSI/MA
# aren't in their toolkit; print flow + liq prints + candle color are.
indicators:
  taker_imbalance:
    window_s: 60
    reference_usd: 500000
    action: follow         # pile into whatever flow direction is live
    weight: 1.0
  liq_imbalance:
    window_s: 90
    reference_usd: 500000
    action: follow         # long liqs → short the flush, short liqs → long the squeeze
    weight: 0.9
  price_momentum:
    window_s: 60
    ref_bps: 20            # 20 bps in 60s = a visible candle
    action: follow
    weight: 0.6
indicator_weight: 0.45
