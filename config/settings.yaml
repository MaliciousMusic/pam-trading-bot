mode: paper                   # paper | live
exchange: binance_perps
symbol: BTCUSDT
base_capital_usd: 50000       # paper-only; bumped so per-trade P&L is visible

# Perpetual futures leverage. $50k equity × 6% per-trade × 15× leverage =
# $45k notional per trade — a 15 bps move is ~$67 P&L, comfortably visible
# and meaningful for analyzing the sizing curve vs realized pnl.
leverage: 15

clock:
  tick_seconds: 3             # voting cadence — fast enough to act on micro-moves
  # 200 × 3s = 10-minute forward horizon. The UI pins prediction anchors at
  # +15s, +1min, +5min, +10min and colors them; over time you get a
  # dot-trail you can compare against actual price. (+15m dropped; beyond horizon.)
  projector_steps: 200

risk:
  # Portfolio caps. Every tick that passes entry gates opens a NEW trade
  # (long or short), so the cap limits how many can stack before we stop
  # adding. Each existing trade runs independently with its own TP/SL.
  max_concurrent_positions: 20
  # Total notional across all open positions cannot exceed this fraction
  # of equity. With leverage 10× and cap 500, we'd use ~50% of available
  # buying power — leaves headroom for adverse moves without margin trouble.
  max_total_notional_pct: 500
  min_hold_seconds: 0           # disabled — each position has its own TP/SL
  max_hold_seconds: 600         # hard backstop if TP/SL never hit

decision:
  min_expected_move_bps: 4    # lowered from 8; realistic market rarely projects >8bps cumulative
  # Conf = signal_quality (agreement-weighted) × directional. With participation
  # no longer collapsing signal_quality, real agreement regularly hits 0.4-0.8,
  # so the floor rises to a meaningful "forecast must be non-trivial" bar.
  min_confidence: 0.25
  # Uncertainty now = 1 - agreement (pure disagreement among voting tribes).
  # 0.70 means "tolerate up to 30% disagreement on the CURRENT tick". Tighter
  # than old 0.90 because 0.90 was mostly measuring low participation, not real
  # disagreement.
  max_uncertainty: 0.70
  reversal_factor: 1.2        # how strongly forecast must flip to kill a position
  # Fee-aware entry gate: the forecast expected_move must clear the
  # ROUND-TRIP cost (entry+exit fees+slippage) with some margin, else
  # the trade is a guaranteed loser even if the forecast is right.
  # Round-trip cost = 2 × (fee_rate_bps + slippage_bps). With defaults that
  # is 14 bps; we require expected_move > 14 + 2 bps margin.
  fee_safety_margin_bps: 2.0
  # Stop-loss: each position's SL is at `sl_ratio × expected_move_bps` against
  # us, floored by `sl_min_bps` to avoid micro-stops on noise. TP is at the
  # forecasted expected_move. With sl_ratio=0.7 that yields R:R ≈ 1.4:1.
  sl_ratio: 0.7
  sl_min_bps: 20.0

# Confidence-bracketed position sizing. At conf = min_confidence we inject
# `min_pct_equity`; at conf = 1.0 we inject `max_pct_equity`. This lets us
# (a) take far more trades by dropping the hard conf gate toward a soft
# size-weighted one, and (b) measure whether higher-conf trades actually
# produce better P&L and whether that relationship is linear or exponential.
#
# Curves:
#   linear     — size grows in proportion to (conf - min_conf)
#   quadratic  — size grows with the square; low-conf entries stay very small
sizing:
  min_pct_equity: 1.0
  max_pct_equity: 6.0
  curve: linear

projector:
  bps_per_unit_pressure: 8.0  # linear kernel: net_pressure=1.0 → 8bps per step
  confidence_decay: 0.9       # multiplicative per step

execution:
  fee_rate_bps: 5.0
  slippage_bps: 2.0

audit:
  horizon_seconds: 60           # forward-price window used to score each tribe vote

# Per-tribe skill calibration (Phase G audit→calibration closed loop).
# Consumes resolved forecast anchors, tracks an EWMA of conviction-weighted
# directional accuracy per tribe, and (optionally) scales that tribe's vote
# conviction by a clamped multiplier in future ticks. `apply: false` is the
# safe default — measure first, close the loop once there's real data.
calibration:
  apply: false                 # flip to true to scale convictions by skill
  halflife_resolved: 500       # EWMA halflife in resolved anchors
  min_samples: 30              # don't multiply until this many resolutions per tribe
  max_shrink: 0.6              # unreliable tribe: down to 0.6× its conviction
  max_boost: 1.4               # reliable tribe: up to 1.4× its conviction

ui:
  host: 127.0.0.1
  port: 8765

logging:
  level: INFO
  dir: logs
