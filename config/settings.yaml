mode: paper                   # paper | live
exchange: binance_perps
symbol: BTCUSDT
base_capital_usd: 50000       # paper-only; bumped so per-trade P&L is visible

# Perpetual futures leverage. $50k equity × 6% per-trade × 15× leverage =
# $45k notional per trade — a 15 bps move is ~$67 P&L, comfortably visible
# and meaningful for analyzing the sizing curve vs realized pnl.
leverage: 15

clock:
  tick_seconds: 3             # voting cadence — fast enough to act on micro-moves
  # 200 × 3s = 10-minute forward horizon. The UI pins prediction anchors at
  # +15s, +1min, +5min, +10min and colors them; over time you get a
  # dot-trail you can compare against actual price. (+15m dropped; beyond horizon.)
  projector_steps: 200

risk:
  # Portfolio caps. Every tick that passes entry gates opens a NEW trade
  # (long or short), so the cap limits how many can stack before we stop
  # adding. Each existing trade runs independently with its own TP/SL.
  max_concurrent_positions: 20
  # Total notional across all open positions cannot exceed this fraction
  # of equity. With leverage 10× and cap 500, we'd use ~50% of available
  # buying power — leaves headroom for adverse moves without margin trouble.
  max_total_notional_pct: 500
  min_hold_seconds: 0           # disabled — each position has its own TP/SL
  max_hold_seconds: 600         # hard backstop if TP/SL never hit

  # Drawdown circuit breaker (added 2026-04-19). Two independent halts —
  # either trips and new entries are rejected; exits and mark-to-market
  # continue so open risk is never trapped.
  #
  #   max_drawdown_from_peak_pct: halt when equity ≤ session_peak × (1−x/100).
  #     Clears when equity recovers above the trigger (peak ratchets up,
  #     so recovery is real, not a rounding flap).
  #
  #   max_daily_loss_pct: halt when equity ≤ day_open × (1−x/100).
  #     Clears on UTC date roll (fresh anchor). Tight circuit on bad days.
  #
  # 8% peak + 5% daily is standard prop-desk — tripping either means pause,
  # review logs, decide before overriding. Set 0.0 to disable.
  max_drawdown_from_peak_pct: 8.0
  max_daily_loss_pct: 5.0

decision:
  # Council-driven entry AND exit. Every non-flat projection opens a trade;
  # each open position is re-evaluated every tick and closed the moment the
  # council flips against it (emove sign reverses beyond the dead zone).
  # No TP/SL brackets — the forecast IS the exit signal.
  #
  # Dead zone: how far the flipped emove must exceed 0 before closing.
  # Prevents whipsaw when the forecast oscillates near zero.
  exit_dead_zone_bps: 3.0
  min_conf: 0.10                # council must agree before opening — below this is noise
  # Sigma-aware sizing: scale position size by min(1.0, sigma_ref_bps / terminal_sigma).
  # Wide forecast fans (chaotic regimes) shrink trades toward `sigma_shrink_floor`;
  # tight fans leave sizing untouched. Terminal sigma = last step of the
  # projector's sigma curve (~10min at defaults). 40bps ref reflects a
  # "normal" realized-move range for the 10-min horizon.
  sigma_ref_bps: 40.0
  sigma_shrink_floor: 0.35

# Higher-timeframe trend gate (added 2026-04-19). A 1h EMA-spread-over-ATR
# score (tanh-squashed to [-1,+1]) is polled once per minute. The decision
# engine shrinks counter-trend entry sizes by:
#     mult = 1 - counter_strength * |score|
# Aligned entries are untouched. This is a SOFT gate — the council still
# fires; we just don't let a 10-min scalper steamroll a bet into the 1h
# trend at full size. Set counter_strength=0 to disable.
htf:
  enabled: true
  timeframe: "1h"
  lookback_candles: 50
  fast_ema: 8
  slow_ema: 21
  poll_seconds: 60
  counter_strength: 0.6     # max shrink when full-opposition (|score|=1)
  max_age_seconds: 7200     # treat polls older than 2h as stale → no shrink

# Multi-layer exit overlay. The base rule (council sign-flip beyond the
# dead zone) stays in place; these layers are ADDITIONAL early-exit triggers
# that fire when any one is satisfied. Collectively they do three things:
#   1. Distinguish strong council flips (close now) from weak, noisy flips
#      (confirm across N ticks) so whipsaw doesn't eat winning positions.
#   2. Protect winners: once a position earns `ratchet_arm_bps`, lock in
#      the bulk of the move by closing on a fractional retrace of the peak.
#   3. Make the dead zone regime-aware — cascade closes tighter (thin book,
#      moves cascade), chop wider (noise should not trigger exits).
exit_strategy:
  # --- Layer 1: conviction-magnitude-aware flip -----------------------------
  # Any flip with confidence >= this closes immediately.
  strong_flip_conf: 0.25
  # Weak flips need this many consecutive flipped ticks before closing.
  # 1 = disabled (all flips close immediately). 2 = one confirmation tick.
  weak_flip_confirm_ticks: 2

  # --- Layer 2: profit ratchet ---------------------------------------------
  # Arms once peak unrealized P&L (in bps of notional) crosses arm_bps;
  # close when current drops to peak * (1 - retrace_frac).
  # Set arm_bps=0 OR retrace_frac>=1.0 to disable.
  #
  # Arm threshold MUST exceed round-trip fees (14 bps at 5/2 fee/slip) or the
  # ratchet close books a net loss. Previous 10bps / 50%-retrace setting gave
  # back 5 bps gross → −9 bps net after fees. Tightened to arm=20 / retrace=0.35
  # so any ratcheted close locks in ≥13 bps gross ≈ −1 bps net worst case.
  ratchet_arm_bps: 20.0          # arm once +20bps of notional is earned
  ratchet_retrace_frac: 0.35     # close on retracing 35% of the peak

  # --- Layer 2c: shape-aware exit ------------------------------------------
  # Decision engine stamps each position with the step at which the forecast
  # peaked in its favor. If still held `shape_grace_seconds` past that peak
  # AND in the green, close — the forecast said this was the top; don't ride
  # it back down. 0 = off.
  shape_grace_seconds: 30

  # --- Layer 2b: forecast-target take-profit -------------------------------
  # Close when unrealized reaches the target the council forecasted at entry:
  # abs(expected_move_bps) × confidence. Suppressed when that target is below
  # round-trip fees (no net-profitable TP is reachable). Disable by setting
  # factor=0; raise factor to require clearing the forecast by that much.
  forecast_tp_factor: 1.0        # 1.0 = exactly the forecasted move × conf
  forecast_tp_min_bps: 0.0       # optional floor; 0 = no extra floor

  # --- Layer 3a: regime-aware dead zone ------------------------------------
  # Scale `decision.exit_dead_zone_bps` by regime label. Missing keys → 1.0.
  dead_zone_regime_mult:
    chop:         1.5            # noisy regime — require wider flip to close
    normal:       1.0
    trend_up:     1.0
    trend_down:   1.0
    cascade_up:   0.5            # thin book — close tighter before it runs
    cascade_down: 0.5

  # --- Layer 3b: edge exhausted --------------------------------------------
  # Close when the forecasted remaining move in the position's direction is
  # less than `round_trip_fees_bps * edge_exhausted_factor`. Enabled now
  # that the projector carries per-tribe horizon decay + mean reversion +
  # sigma fan, so its "remaining forward move" estimate is trustworthy
  # enough to grade a graceful top-of-move close.
  edge_exhausted_factor: 1.0
  edge_exhausted_min_age_s: 20

# Confidence-weighted position sizing. At conf = 0 we inject `min_pct_equity`;
# at conf = 1.0 we inject `max_pct_equity`. Every non-flat council projection
# opens a trade; the council's own conf folds in agreement — noisy regimes
# already get small positions without a hard gate.
#
# Curves:
#   linear     — size grows in proportion to conf
#   quadratic  — size grows with conf²; low-conf entries stay very small
sizing:
  min_pct_equity: 1.0
  max_pct_equity: 6.0
  curve: linear
  # Note: conf=0 trades get `min_pct_equity`; conf=1 gets `max_pct_equity`.
  # There is no minimum-confidence gate — the council's own disagreement
  # already folds into conf (agreement-weighted signal_quality), so
  # low-conf = already-small trade.

projector:
  bps_per_unit_pressure: 8.0  # linear kernel: net_pressure=1.0 → 8bps per step
  # Decay kernel: step i contributes decay^i to expected_move and confidence.
  # 0.90 → effective horizon ≈ 1/(1-0.9) = 10 steps (~30s). With projector_steps=200
  # that meant the forecast collapsed to the next ~10 steps regardless of the
  # 10-min setting. 0.98 → effective horizon ≈ 50 steps (~2.5 min) of the
  # 200-step (10-min) projection — the far horizon still contributes meaningfully
  # while near steps still dominate.
  confidence_decay: 0.98
  # Wiggly-path enrichments (added 2026-04-19). Each addresses one failure
  # mode of the scalar-projection curve that shipped previously:
  #   - per_tribe_horizon_decay: a scalper's vote no longer lasts 10min; it
  #     decays on its own hold_seconds so the far horizon is dominated by
  #     swing traders only. Implemented inside the projector regardless of
  #     this flag (flag kept for future off-switch if needed).
  #   - mean_reversion_rate: OU pull toward zero on cumulative drift. 0.02
  #     means ~2% of the running total gets clawed back each step — keeps
  #     persistent small pressures from compounding into unrealistic runs.
  #     Set to 0 to disable.
  #   - sample_paths_n: number of Monte Carlo realizations drawn around the
  #     expected curve each tick. UI renders them as faint lines behind the
  #     main forecast. 0 disables sampling.
  #   - default_horizon_seconds: fallback hold_seconds when a tribe spec
  #     omits it.
  #   - default_sigma_bps: sigma used for sampling before the backscorer has
  #     resolved `min_samples` anchors. Scales as √t across the horizon.
  mean_reversion_rate: 0.02
  sample_paths_n: 20
  default_horizon_seconds: 600
  default_sigma_bps: 8.0

# Phase A — live projector-gain fitting. Each resolved backscore anchor
# updates a running EWMA of `realized / predicted` bps; the correction is
# applied to `bps_per_unit_pressure` so the forecast stops being systematically
# off-scale. Clamped to [1, 40] bps so a bad fit can't silence or blow up.
# `apply: true` pushes the fitted value onto the projector live; `false`
# measures only (visible in UI, projector keeps the hand-picked default).
projector_calibration:
  apply: true
  halflife_resolved: 300    # EWMA halflife in resolved anchors (~15–30 min)
  min_samples: 50           # wait for this many usable pairs before adjusting
  window: 2000              # trailing pairs kept for the median fit

execution:
  fee_rate_bps: 5.0
  slippage_bps: 2.0
  # Size-scaled slippage (added 2026-04-19). Stacked entries on the same
  # directional bet aren't truly independent — real markets eat through
  # the book. Model this as:
  #     effective_bps = slippage_bps × (1 + k × size_usd / ref_notional)
  # With k=0.5 and ref=100k, a $100k fill costs 2×1.5=3bps; a $300k fill
  # costs 2×2.5=5bps. Set k=0 to collapse back to flat slippage.
  slippage_size_k: 0.5
  slippage_ref_notional_usd: 100000.0

audit:
  horizon_seconds: 60           # forward-price window used to score each tribe vote

# Per-tribe skill calibration (Phase G audit→calibration closed loop).
# Consumes resolved forecast anchors, tracks an EWMA of conviction-weighted
# directional accuracy per tribe, and (optionally) scales that tribe's vote
# conviction by a clamped multiplier in future ticks. `apply: false` is the
# safe default — measure first, close the loop once there's real data.
calibration:
  apply: true                  # scales vote conviction by measured skill
  halflife_resolved: 500       # slow EWMA halflife in resolved anchors (stable skill)
  min_samples: 30              # don't multiply until this many resolutions per tribe
  max_shrink: 0.6              # unreliable tribe: down to 0.6× its conviction
  max_boost: 1.4               # reliable tribe: up to 1.4× its conviction
  # Phase H — within-session regime adaptation. A fast EWMA runs in parallel
  # at a much shorter halflife. When it diverges from the slow estimate by
  # more than `regime_shift_threshold`, the fast score takes over — the
  # tribe has entered a changed regime and the stale history is no longer
  # informative. Resolves the chop→cascade-flip adaptation gap where a
  # tribe skilled in one regime bleeds conviction into the next one until
  # the slow EWMA catches up hundreds of anchors later.
  fast_halflife_resolved: 50   # fast EWMA halflife (~minutes within a busy session)
  fast_min_samples: 10         # fast floor — smaller because halflife is smaller
  regime_shift_threshold: 0.12 # |fast − slow| above this triggers fast-override
  # Regime-conditional skill (added 2026-04-19). Tracks a separate EWMA per
  # (tribe, regime) pair using the regime stamped at vote time. When a
  # tribe has ≥ regime_min_samples resolutions in the CURRENT regime, that
  # per-regime score takes priority over the global EWMA — resolves the
  # "trend tribe bleeds conviction in chop" gap that the fast EWMA alone
  # can't close fast enough. Disable by flipping enable_regime_conditional.
  enable_regime_conditional: true
  regime_min_samples: 15

# Phase E — live regime overlay. Every tick the classifier labels the tape
# from MarketState stats (realized vol, drift efficiency, recent liquidations)
# and its multiplier scales the projector's kernel gain. Chop dampens
# (price mean-reverts, pressure doesn't stick), cascade amplifies (thin book,
# liquidations self-reinforce), trend/normal sit between. This is a single
# scalar by design — keeps the projector auditable.
regime:
  vol_window_s: 300            # rolling realized-vol window (5 min)
  liq_window_s: 60             # liquidation tally window
  chop_vol_bps: 15.0           # vol ≤ this OR eff ≤ chop_eff → chop
  chop_eff: 0.30               # drift/range ratio below this = chop
  trend_eff: 0.55              # drift/range ratio above this = trend
  cascade_vol_bps: 60.0        # vol ≥ this → cascade (overrides chop/trend)
  cascade_liq_usd: 5000000     # 60s liquidations ≥ this → cascade
  multipliers:
    chop:         0.6
    normal:       1.0
    trend_up:     1.2
    trend_down:   1.2
    cascade_up:   1.7
    cascade_down: 1.7

ui:
  host: 127.0.0.1
  port: 8765

# Phase D — event-tape recorder. Persists the bus stream to
# data/events/YYYY-MM-DD.jsonl so the nightly tournament (scripts/
# run_tournament.py) can score variant councils against the same
# session the parent lived through. Depth@100ms events are excluded by
# default because they dominate volume (millions/day); flip include_depth
# to true if a variant's depth-kernel sensitivity needs full fidelity.
recorder:
  include_depth: false

logging:
  level: INFO
  dir: logs

# Historical replay harness. Reads cached 1m klines + 8h funding history and
# feeds the live pipeline unchanged. Two modes: sprint (headless batch) and
# watch (paced virtual clock + UI at /replay). Cold-start is intentional —
# no warmup, no HTF pre-fill, so the report visualizes whether the council
# stabilizes as context accumulates. See src/replay/ for the implementation.
replay:
  cache_dir: data                # kline/funding caches under data/klines, data/funding
  outputs_dir: data/replays      # per-run decision logs + summary zips live here
  rng_seed: 42                   # master seed; per-tribe seeds derived from this
  # Multi-variant sprint default: these three synth rates run in parallel
  # from the same kline fetch. 6 = skeletal flow, 60 = ~1/sec (close to live
  # aggTrade cadence), 600 = dense. Comparison exposes whether tribe votes
  # are robust to flow-granularity or whether they're reading noise.
  default_variants:
    - synth_6
    - synth_60
    - synth_600
  watch_default_speed: 10        # × real-time; user can pick 1/10/25/50/100
  parallel_day_fetches: 2        # kline fetcher politeness cap
