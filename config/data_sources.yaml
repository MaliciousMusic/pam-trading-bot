# Registry of data sources. Each source emits normalized Events onto the bus.
# `enabled: true` = wired now. `enabled: false` = planned, not yet implemented.

sources:
  binance_perps_ws:
    enabled: true
    kind: websocket
    endpoint: wss://fstream.binance.com/stream
    streams:
      - btcusdt@aggTrade       # aggregated trades (taker flow)
      - btcusdt@forceOrder     # liquidations
      - btcusdt@markPrice@1s   # mark price + funding rate (1s cadence)
      - btcusdt@depth20@100ms  # top 20 bids/asks, 100ms snapshots — feeds
                               # depth-aware projector kernel (thin book →
                               # pressure moves price more; deep book →
                               # same pressure gets absorbed).

  # Phase F — multi-venue open interest. We skip CoinGlass's gated API
  # and aggregate Binance/Bybit/OKX public OI endpoints directly — same
  # signal, zero auth. Emits one kind="oi" event per venue per poll.
  multi_venue_oi:
    enabled: true
    kind: rest_poll
    poll_seconds: 60
    venues: [binance, bybit, okx]

  # Phase F — cross-venue taker flow. Public trade streams from Bybit and
  # OKX feed a separate `cross_trade` event kind so Binance's own taker
  # flow (the execution venue's actual felt pressure) stays distinct.
  # Enables the cross_venue_arb archetype in Phase G.
  bybit_ws:
    enabled: true
    kind: websocket
    endpoint: wss://stream.bybit.com/v5/public/linear
    streams: [publicTrade.BTCUSDT]
  okx_ws:
    enabled: true
    kind: websocket
    endpoint: wss://ws.okx.com:8443/ws/v5/public
    streams: [trades:BTC-USDT-SWAP]

  # CryptoPanic is served through the shared RSS poller (their free feed
  # at /news/btc/feed/ — no key required). See src/ingress/rss_feeds.py
  # CURATED_FEEDS. Leaving this entry here as a placeholder for any
  # future API-token-based enrichment.
  cryptopanic_news:
    enabled: false
    kind: rest_poll
    poll_seconds: 30

  reddit_public:
    enabled: true              # r/Bitcoin, r/CryptoCurrency, r/BitcoinMarkets via /new/.rss
    kind: rest_poll
    poll_seconds: 180
    subs: [Bitcoin, CryptoCurrency, BitcoinMarkets]

  fear_greed_index:
    enabled: true              # alternative.me FGI — free, daily-updated
    kind: rest_poll
    poll_seconds: 3600

  # Curated free RSS/Atom feeds — regulation (SEC/Fed/CFTC), crypto press
  # (Coindesk/Cointelegraph/…), mainstream business, and influencer substacks
  # + Nitter Twitter mirrors. Feed list lives in src/ingress/rss_feeds.py:CURATED_FEEDS.
  # Each feed hit is polite: 20s timeout, 2s gap between feeds, 180s between
  # sweeps. No auth, no keys, respect robots.txt. Nitter mirrors are fragile;
  # a dead feed logs a warning and the poller continues.
  rss_news:
    enabled: true
    kind: rest_poll
    poll_seconds: 180
    retry_seconds: 120
