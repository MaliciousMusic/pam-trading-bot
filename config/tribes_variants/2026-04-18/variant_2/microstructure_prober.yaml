  capital_band_usd:
  - 10000000.0
  - 250000000.0
  count_estimate: 30
  experience_years:
  - 4.0
  - 25.0
  jurisdiction:
  - NA
  - EU
  - APAC
hardware:
  tier: colo
  typical_latency_ms: 1
  uptime: continuous
  specs:
    placement: exchange_colo_or_peered
    nics: kernel_bypass
    feed: full_depth_l2
software:
  platforms:
  - custom_c++_oms
  - kdb_tickdb
  tools:
  - l2_orderbook_recorder
  - queue_position_estimator
  - iceberg_classifier
  charting: custom
  order_types_used:
