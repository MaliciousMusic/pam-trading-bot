id: microstructure_prober
name: Microstructure Prober
description: "The silent tribe. Reads order-book microstructure that the rest of the\
  \ council ignores: persistent L2 imbalance, queue-position decay, iceberg refills,\
  \ and trade-size entropy. None of the other tribes touch the depth series or per-trade\
  \ notional distribution, so its vote is genuinely orthogonal \u2014 when 16 tribes\
  \ agree on momentum but the prober sees the opposite ask wall melting and a hidden\
  \ iceberg restocking it, that's the signal a herd-following council was structurally\
  \ blind to."
