id: basis_arb
name: Cash-and-Carry Basis Arb
description: "Structural capital that reads annualized basis (funding \xD7 3 \xD7\
  \ 365), the perp/mark premium, and open-interest expansion together. Fades persistent\
  \ rich basis \u2014 short perp, long spot \u2014 and leans harder when OI is building\
  \ on the paid side (the crowded trade is about to unwind). Slow, patient holds.\
  \ Distinct from the contrarian funding fader: they key off *annualized persistence*\
  \ and OI buildup, not the single-epoch print."
