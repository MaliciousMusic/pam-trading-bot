id: cross_venue_arb
name: Cross-Venue Spread Arb
description: "Spread traders reading Binance taker aggression against Bybit/OKX flow.\
  \ When Binance runs materially hotter than the external-venue average (one venue\
  \ leading, rest of market quiet), they fade \u2014 the spread usually closes over\
  \ the next 30-120 seconds as either external venues catch up or the leading venue\
  \ reverts. Uses MarketState.cross_venue_divergence over short + long windows for\
  \ persistence confirmation."
