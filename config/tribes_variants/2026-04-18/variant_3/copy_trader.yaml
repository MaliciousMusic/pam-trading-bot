id: copy_trader
name: Copy Trader (Signal Follower)
description: "Retail auto-following \"lead traders\" on Binance Copy Trading, Bybit\
  \ Copy, bitget, plus Telegram signal groups and YouTube influencers. Capital replicates\
  \ whatever the leader does \u2014 but with latency and attenuation. Their entries\
  \ LAG the move they're chasing, which means they reliably buy strength and sell\
  \ weakness seconds-to-minutes after it already printed. A crowded, trend-confirming\
  \ cohort."
