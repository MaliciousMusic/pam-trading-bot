id: retail_grid_bot
name: Retail Grid Bot
description: "Retail-facing automated trading bots (3Commas, Pionex, Binance native\
  \ grid, custom Python scripts on a Raspberry Pi). Place a ladder of passive limit\
  \ orders around a moving mid; buy every dip, sell every rip, mechanically. Plentiful\
  \ \u2014 one of the largest cohorts in crypto retail now. Never sleeps and never\
  \ pulls quotes, so under sustained one-way flow it bleeds into the move rather than\
  \ stepping aside like a pro MM."
