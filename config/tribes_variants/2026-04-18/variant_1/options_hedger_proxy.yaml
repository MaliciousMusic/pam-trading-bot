id: options_hedger_proxy
name: Options Dealer Hedge Proxy
description: "Synthetic proxy for options-dealer hedge flow. Without Deribit book\
  \ access on the free tier, this archetype reads realized-vol regime + time-of-day\
  \ as a proxy for the dominant hedging pattern: in calm tape dealers are assumed\
  \ LONG gamma (fade moves), in violent tape they're assumed SHORT gamma (amplify\
  \ moves). Weighted by daily hedge windows \u2014 Asia open (UTC 23-02) and US open\
  \ (UTC 13-15). Explicitly a PROXY \u2014 treated as one voice in the council, not\
  \ truth."
